name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: CI feedback on a stale
# commit is noise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces. app/offline.py clears these at import, but a runner that
  # never reaches Python should not have them set either.
  LANGCHAIN_TRACING_V2: "false"
  LANGSMITH_TRACING: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Backend — lint, format, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # The declared floor, not the newest interpreter. Running on 3.12 is what
      # stops syntax from a later version reaching the codebase unnoticed.
      - name: Install Python 3.12
        run: uv python install 3.12

      # No `--all-extras`: the base install is the offline path (§6), and the
      # default suite passing without chromadb, fastembed, or the provider
      # packages is the assertion that the path is real.
      - name: Sync base + dev dependencies only
        run: uv sync --frozen --python 3.12

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      # Called out separately so a failure reads as "the offline guarantee
      # broke" rather than as one anonymous test among many.
      - name: Offline guarantee
        run: uv run pytest tests/test_offline_guard.py -v

      - name: Every scenario reaches its intended branch
        run: uv run python -m tools.calibrate

  contract:
    name: Contract — generated types must not drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: uv python install 3.12
        working-directory: backend

      - run: uv sync --frozen --python 3.12
        working-directory: backend

      - run: npm ci
        working-directory: frontend

      - name: Re-export the OpenAPI schema
        run: uv run python -m tools.export_openapi
        working-directory: backend

      - name: Regenerate the TypeScript contract
        run: npm run gen:types
        working-directory: frontend

      # The whole point of Phase 0: a contract change that is not mirrored on the
      # other side fails here, within one CI run, instead of at runtime.
      - name: Fail if the committed contract is stale
        run: |
          if ! git diff --exit-code -- backend/openapi.json frontend/src/lib/api-types.ts; then
            echo "::error::The committed contract is out of date."
            echo "::error::Run 'uv run python -m tools.export_openapi' in backend/,"
            echo "::error::then 'npm run gen:types' in frontend/, and commit both files."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

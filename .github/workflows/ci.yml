name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: CI feedback on a stale
# commit is noise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces. haven/offline.py clears these at import, but a runner that
  # never reaches Python should not have them set either.
  LANGCHAIN_TRACING_V2: "false"
  LANGSMITH_TRACING: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  engine:
    name: Engine — lint, format, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The declared floor, not the newest interpreter. Running on 3.12 is what
      # stops syntax from a later version reaching the codebase unnoticed.
      - name: Install Python 3.12
        run: uv python install 3.12

      # No `--all-extras`: the base install is the offline path (§6), and the
      # default suite passing without chromadb, fastembed, or the provider
      # packages is the assertion that the path is real.
      - name: Sync base + dev dependencies only
        run: uv sync --frozen --python 3.12

      # The offline path is not just "the tests pass" -- it is that the engine
      # runs at all with nothing optional installed. Phase 5 broke this by
      # declaring rank-bm25 optional while making BM25 the offline terminal, and
      # a passing test suite would not have caught it if collection had not
      # failed first.
      - name: The engine runs with no extras
        run: |
          uv run python -c "
          import os
          os.environ['HAVEN_LEDGER_DB'] = '/tmp/ci-probe.db'
          from haven import engine
          from haven.contracts import EvaluationRequest
          from haven.data.scenarios import BY_ID
          from haven.reasoning.llm import MockGraniteLLM
          r = engine.evaluate(EvaluationRequest.model_validate(BY_ID['burn_fatigue'].build()), llm=MockGraniteLLM())
          assert r.situations[0].recommendation.action == 'second_operator_verify'
          print('offline path OK:', r.tier_status.retrieval)
          "

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      # Called out separately so a failure reads as "the offline guarantee
      # broke" rather than as one anonymous test among many.
      - name: Offline guarantee
        run: uv run pytest tests/test_offline_guard.py -v

      # The registry is the part of the corpus that is in the repository, so it
      # is the part CI can check on a runner that has never downloaded a NASA
      # document. What degrades silently is exactly what these assert: a stale
      # revision letter, an unpinned checksum, a verification note reduced to
      # "checked", an extraction report left behind by a registry edit.
      - name: Corpus provenance
        run: uv run pytest tests/test_corpus_registry.py -v

      - name: Every scenario reaches its intended branch
        run: uv run python -m scripts.calibrate

      # Exits non-zero on an unsafe citation -- a recommendation citing a
      # passage that does not govern. Accuracy varies by provider and is
      # reported rather than gated; this one must be zero for all of them.
      - name: Reasoning tier evaluation (offline provider)
        run: uv run python -m evaluation.run_eval --provider mock --verbose

  # The engine job above proves the offline path: base install, no extras, no
  # network. This one proves nothing was lost to that constraint -- every
  # optional subsystem installed, and the complete suite run including the
  # compiler tests the base job skips.
  #
  # Both are required. Without the first, an optional dependency could quietly
  # become mandatory and break the offline guarantee, which is exactly what
  # happened to rank-bm25 in Phase 5. Without the second, tests could be skipped
  # everywhere and nobody would notice.
  full:
    name: Full — every extra installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync every extra
        run: uv sync --frozen --all-extras --python 3.12

      - name: Complete test suite
        run: uv run pytest -q

      # The compiler tests are the reason this job exists; a run that skipped
      # them would report success while proving less than the base job does.
      - name: The compiler tests actually ran
        run: uv run pytest tests/test_compiler_extract.py tests/test_compiler_end_to_end.py -q --no-header

  contract:
    name: Contract — generated types must not drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: uv python install 3.12

      - run: uv sync --frozen --python 3.12

      - run: npm ci
        working-directory: web

      - name: Re-export the OpenAPI schema
        run: uv run python -m scripts.export_openapi

      - name: Regenerate the TypeScript contract
        run: npm run gen:types
        working-directory: web

      # The whole point of Phase 0: a contract change that is not mirrored on the
      # other side fails here, within one CI run, instead of at runtime.
      - name: Fail if the committed contract is stale
        run: |
          if ! git diff --exit-code -- openapi.json web/src/lib/api-types.ts; then
            echo "::error::The committed contract is out of date."
            echo "::error::Run 'uv run python -m scripts.export_openapi', then"
            echo "::error::'npm run gen:types' in web/, and commit both files."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Build the static export
        run: npm run build
        working-directory: web

      # The export is what the container serves. If it stops being produced,
      # the image would ship an API with no console and nothing would say so.
      - name: The export exists
        run: test -f web/out/index.html
